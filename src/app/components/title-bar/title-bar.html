<header class="title-bar" data-tauri-drag-region>
  <div class="left" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <span class="logo" data-tauri-drag-region></span>
      <span class="name" data-tauri-drag-region>Daycove</span>
    </div>
  </div>

  <div class="drag-spacer" data-tauri-drag-region></div>

  <div class="window-controls">
    <div class="theme-toggle">
      <button
        class="win-btn"
        [attr.title]="theme() === 'light' ? i18n.translate('titlebar.enableDark') : i18n.translate('titlebar.enableLight')"
        (click)="toggleTheme()"
      >
        @if (theme() === 'light') {
          <lucide-angular name="moon" [size]="14" [strokeWidth]="2" />
        } @else {
          <lucide-angular name="sun" [size]="14" [strokeWidth]="2" />
        }
      </button>
    </div>

    <button class="win-btn" [attr.title]="i18n.translate('titlebar.minimize')" (click)="onMinimize()">
      <lucide-angular name="minus" [size]="10" [strokeWidth]="1" />
    </button>

    <button
      class="win-btn"
      [attr.title]="isMaximized() ? i18n.translate('titlebar.restore') : i18n.translate('titlebar.maximize')"
      (click)="onToggleMaximize()"
    >
      @if (isMaximized()) {
        <lucide-angular name="copy" [size]="10" [strokeWidth]="1" />
      } @else {
        <lucide-angular name="square" [size]="10" [strokeWidth]="1" />
      }
    </button>

    <button class="win-btn close" [attr.title]="i18n.translate('titlebar.close')" (click)="onClose()">
      <lucide-angular name="x" [size]="10" [strokeWidth]="1" />
    </button>
  </div>
</header>
