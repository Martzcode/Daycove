<header class="title-bar">
  <div class="left" data-tauri-drag-region>
    <button
      class="icon-btn"
      [attr.title]="sidebarOpen() ? 'Masquer le menu' : 'Afficher le menu'"
      (click)="toggleSidebar.emit()"
    >
      @if (sidebarOpen()) {
        <lucide-angular name="x" [size]="16" [strokeWidth]="2" />
      } @else {
        <lucide-angular name="menu" [size]="16" [strokeWidth]="2" />
      }
    </button>

    <div class="brand" data-tauri-drag-region>
      <span class="logo" data-tauri-drag-region></span>
      <span class="name" data-tauri-drag-region>Daycove</span>
    </div>
  </div>

  <div class="drag-spacer" data-tauri-drag-region></div>

  <div class="window-controls">
    <div class="theme-toggle">
      <button
        class="win-btn"
        [attr.title]="theme() === 'light' ? 'Activer le thème sombre' : 'Activer le thème clair'"
        (click)="toggleTheme()"
      >
        @if (theme() === 'light') {
          <lucide-angular name="moon" [size]="14" [strokeWidth]="2" />
        } @else {
          <lucide-angular name="sun" [size]="14" [strokeWidth]="2" />
        }
      </button>
    </div>

    <button class="win-btn" title="Réduire" (click)="onMinimize()">
      <lucide-angular name="minus" [size]="10" [strokeWidth]="1" />
    </button>

    <button class="win-btn" [attr.title]="isMaximized() ? 'Restaurer' : 'Agrandir'" (click)="onToggleMaximize()">
      @if (isMaximized()) {
        <lucide-angular name="copy" [size]="10" [strokeWidth]="1" />
      } @else {
        <lucide-angular name="square" [size]="10" [strokeWidth]="1" />
      }
    </button>

    <button class="win-btn close" title="Fermer" (click)="onClose()">
      <lucide-angular name="x" [size]="10" [strokeWidth]="1" />
    </button>
  </div>
</header>
