<nav class="sidebar" [attr.aria-label]="i18n.translate('nav.aria')">
  <a
    class="nav-item"
    routerLink="/calendar"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    <lucide-angular name="calendar" [size]="18" [strokeWidth]="1.8" />
    <span>{{ i18n.translate('nav.calendar') }}</span>
  </a>

  <a class="nav-item" routerLink="/tasks" routerLinkActive="active">
    <lucide-angular name="list-checks" [size]="18" [strokeWidth]="1.8" />
    <span>{{ i18n.translate('nav.tasks') }}</span>
  </a>

  <a class="nav-item" routerLink="/settings" routerLinkActive="active">
    <lucide-angular name="settings" [size]="18" [strokeWidth]="1.8" />
    <span>{{ i18n.translate('nav.settings') }}</span>
  </a>

  <a class="nav-item" routerLink="/about" routerLinkActive="active">
    <lucide-angular name="info" [size]="18" [strokeWidth]="1.8" />
    <span>{{ i18n.translate('nav.about') }}</span>
  </a>
</nav>
