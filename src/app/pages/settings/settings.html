<section class="page">
  <h1>{{ i18n.translate('nav.settings') }}</h1>

  <div class="settings-card">
    <div class="form-row">
      <label class="form-label" for="language-select">
        {{ i18n.translate('settings.language') }}
      </label>
      <div class="form-control">
        <select
          id="language-select"
          class="form-select"
          (change)="onLocaleChange($event)"
        >
          @for (language of languages; track language.code) {
            <option [value]="language.code" [selected]="i18n.locale() === language.code">
              {{ language.nativeName }} ({{ language.short }})
            </option>
          }
        </select>
      </div>
    </div>
    <div class="form-row">
      <label class="form-label" for="week-start-select">
        {{ i18n.translate('settings.weekStart') }}
      </label>
      <div class="form-control">
        <select
          id="week-start-select"
          class="form-select"
          (change)="onWeekStartChange($event)"
        >
          @for (weekStart of weekStarts; track weekStart) {
            <option [value]="weekStart" [selected]="settings.weekStart() === weekStart">
              {{ i18n.translate('settings.weekStart.' + weekStart) }}
            </option>
          }
        </select>
      </div>
    </div>
  </div>
</section>
