<section class="calendar-page">
  <div class="calendar-header">
    <h1>{{ monthYear() }}</h1>
    <div class="calendar-nav">
      <button class="nav-btn" [attr.title]="i18n.translate('calendar.previousWeek')" (click)="previousWeek()">
        <lucide-angular name="chevron-left" [size]="16" [strokeWidth]="2" />
      </button>
      <button class="nav-btn today-btn" (click)="goToToday()">{{ i18n.translate('calendar.today') }}</button>
      <button class="nav-btn" [attr.title]="i18n.translate('calendar.nextWeek')" (click)="nextWeek()">
        <lucide-angular name="chevron-right" [size]="16" [strokeWidth]="2" />
      </button>
    </div>
  </div>

  <div class="calendar-body">
    <div class="calendar-grid">
      <div class="grid-corner"></div>

      @for (day of days(); track day.date) {
        <div class="day-header" [class.today]="day.isToday">
          <span class="day-name">{{ day.label }}</span>
          <span class="day-num">{{ day.date }}</span>
        </div>
      }

      @for (hour of hours; track hour) {
        <div class="hour-label"><span>{{ hour }}h</span></div>
        @for (day of days(); track day.date) {
          <div class="time-cell" [class.today]="day.isToday"></div>
        }
      }
    </div>
  </div>
</section>
