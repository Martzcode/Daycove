[package]
name = "daycove"
version = "0.1.0"
description = "Daycove - Todolist application"
authors = ["Daycove"]
license = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "daycove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["objc2-app-kit", "WKWebView"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
gdk = "0.18"
glib = "0.18"
gobject-sys = "0.18"
gtk = "0.18"
webkit2gtk = "=2.0.2"
